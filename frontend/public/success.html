<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
        }
        .success-container {
            background: #ffffff;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            width: 320px;
        }
        h2 {
            color: #28a745;
            margin-top: 0;
        }
        p {
            color: #666666;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h2>Success!</h2>
        <p>Data submitted successfully.</p>
        <a href="/">Go Back</a>
    </div>
</body>
</html>
